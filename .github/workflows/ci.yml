name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: seven-framework-server/go.mod
          cache-dependency-path: seven-framework-server/go.sum
      - name: Check formatting
        run: make -C seven-framework-server fmt-check
      - name: Vet
        run: make -C seven-framework-server vet
      - name: Test
        run: make -C seven-framework-server test
      - name: Check DDD import boundaries
        run: scripts/check-ddd.sh
      - name: Race test critical boundaries
        working-directory: seven-framework-server
        run: >-
          go test -race
          ./cmd/seven-framework-server
          ./internal/bootstrap/...
          ./internal/app/authorization/...
          ./internal/app/system/cache_governance/...
          ./internal/infrastructure/messaging/...
          -count=1
      - name: Build service
        run: make -C seven-framework-server build-release VERSION=ci
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          scripts/check-go-vulnerabilities.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
          cache-dependency-path: seven-framework-web/pnpm-lock.yaml
      - name: Install
        working-directory: seven-framework-web
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        working-directory: seven-framework-web
        run: pnpm audit --prod --audit-level high
      - name: Type-check
        working-directory: seven-framework-web
        run: pnpm exec tsc -b
      - name: Lint
        working-directory: seven-framework-web
        run: pnpm lint
      - name: Build
        working-directory: seven-framework-web
        run: pnpm build
      - name: Contract tests
        working-directory: seven-framework-web
        run: node --test tests/*.test.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: seven-framework-server/go.mod
          cache: false
      - name: Scan complete Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git .
